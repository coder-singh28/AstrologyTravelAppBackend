<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Astrology Travel App</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2b2b4f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.35);
            color: #333;
        }

        .app-title {
            text-align: center;
            margin-bottom: 15px;
        }

        .app-title h1 {
            margin: 0;
            font-size: 26px;
            color: #2b2b4f;
        }

        .app-title p {
            font-size: 14px;
            color: #666;
            margin-top: 6px;
        }

        /* User Info Card */
        .user-card {
            background: #f4f6ff;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 20px 0;
            border-left: 4px solid #5a5ad6;
        }

        .user-card h3 {
            margin: 0 0 6px;
            font-size: 16px;
            color: #5a5ad6;
        }

        .user-card p {
            margin: 4px 0;
            font-size: 14px;
            color: #444;
        }

        .user-card span {
            font-weight: 600;
        }

        form label {
            display: block;
            font-size: 14px;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        form input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        form input:focus {
            border-color: #5a5ad6;
        }

        .btn {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: #5a5ad6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #4747c2;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- App Header -->
    <div class="app-title">
        <h1>🌌 AstrologyTravelApp</h1>
        <p>Plan your journey with cosmic guidance</p>
    </div>

    <!-- User Info Section -->
    <div class="user-card">
        <h3>👤 User Information</h3>
        <p>Name: <span>{{ name }}</span></p>
        <p>Email: <span>{{ email }}</span></p>
        <p>dob: <span>{{ dob }}</span></p>
        <p>tob: <span>{{ tob }}</span></p>
        <p>pob: <span>{{ pob }}</span></p>



        <form action="/logout" method="post">
            <button type="submit">Logout</button>
        </form>
    </div>

    <!-- Travel Form -->
    <form action="/check-direction" method="post">
        <label for="location">From Travel Location</label>
        <input type="text" id="f_location" name="source" placeholder="Enter From" required value="Pune">

        <label for="location">To Travel Location</label>
        <input type="text" id="l_location" name="destination" placeholder="Enter To" required value="Delhi">

        <label for="date">Date of Travel</label>
        <input type="date" id="date" name="travel_date" required>

        <label for="time">Time of Travel</label>
        <input type="time" id="time" name="travel_time" required>

        <button type="submit" class="btn">
            🔮 Check Travel Astrology
        </button>
    </form>

    <div class="footer">
        ✨ Nakshatra & planetary guidance powered by Vedic Astrology
    </div>

</div>

</body>
</html>
